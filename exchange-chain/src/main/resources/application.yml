server:
  port: 8105
  # Tomcat 线程池调优（高并发）
  tomcat:
    threads:
      max: 300
      min-spare: 20
    accept-count: 200
    max-connections: 10000
    connection-timeout: 10000
spring:
  application:
    name: exchange-chain

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP

  datasource:
    # Druid连接池配置
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/web3_exchange?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

    # 连接池配置（调优：max-active 20→50 应对峰值连接）
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      use-global-data-source-stat: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.web3.exchange.chain.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      table-prefix: t_
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    auto-mapping-behavior: full
    cache-enabled: true
    call-setters-on-nulls: true

# OpenFeign
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000

# =============== 链上域配置 ===============
chain:
  # 充值区块扫描
  scan:
    enabled: true
    interval-ms: 3000
    batch-size: 100
    start-block: 0
    safety-window: 3
  # 热钱包（仅 Mock/测试网；生产严禁明文，用环境变量 CHAIN_HOT_PRIVATE_KEY / KMS 注入）
  hot-wallet:
    platform-user-id: 900004
    private-key: ${CHAIN_HOT_PRIVATE_KEY:ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
  # HD 钱包（BIP44 每用户充币地址派生；生产用 CHAIN_HD_MNEMONIC / KMS/HSM）
  hd-wallet:
    mnemonic: "${CHAIN_HD_MNEMONIC:test test test test test test test test test test test junk}"
  # 自托管钱包（用户私钥加密；生产用 CHAIN_SELF_ENCRYPT_SECRET / KMS）
  self-wallet:
    encrypt-secret: "${CHAIN_SELF_ENCRYPT_SECRET:mock-self-wallet-encrypt-secret-0123456789}"
  # 提现冷热分流：大额冷钱包离线签名，小额热钱包在线签名
  withdraw:
    # 阈值(最小单位)：>= 该值走冷钱包。USDT 6位小数 -> 500000=0.5 USDT；实际需按币精度配置
    cold-threshold: 500000
    cold-required-signs: 2             # 冷钱包多签所需签名数(N 审 1 签演示)

# 最简SpringDoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.web3.exchange.chain: debug

# 分布式链路追踪（Micrometer Tracing → Zipkin）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # 暴露 Prometheus 指标
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0   # 全采样（演示/排查场景；生产可按需降低如0.1）
