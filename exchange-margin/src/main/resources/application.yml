server:
  port: 8110
spring:
  application:
    name: exchange-margin

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/web3_exchange?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      use-global-data-source-stat: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.web3.exchange.margin.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      table-prefix: t_
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    auto-mapping-behavior: full
    cache-enabled: true
    call-setters-on-nulls: true

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000

# =============== 杠杆配置 ===============
margin:
  # 平台资金池用户（借币由平台垫付，MVP 简化：仅本模块表，不动 asset）
  platform-user-id: 900005
  # 计息开关与周期
  interest:
    enabled: true
  # 强平开关
  liquidation:
    enabled: true
    # 强平折价率（百分数，95=95%）
    liquidation-discount: 95

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.web3.exchange.margin: debug
