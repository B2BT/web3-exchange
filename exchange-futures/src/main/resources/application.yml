server:
  port: 8117
  # Tomcat 线程池调优（高并发）
  tomcat:
    threads:
      max: 300
      min-spare: 20
    accept-count: 200
    max-connections: 10000
    connection-timeout: 10000
spring:
  application:
    name: exchange-futures
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/web3_exchange?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池调优
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: futures-hikari
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server-settings:
  mark:
    # 标记价 = 现货ticker价格 × (1 + 基差因子)
    basis-factor: 0.0002
    refresh-interval-ms: 5000

logging:
  level:
    com.web3.exchange.futures: info

# 分布式链路追踪（Micrometer Tracing → Zipkin）
management:
  tracing:
    sampling:
      probability: 1.0   # 全采样（演示/排查场景；生产可按需降低如0.1）
