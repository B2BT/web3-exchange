# ArgoCD Application：GitOps 自动同步 web3-exchange 部署
# 指向本仓库 k8s/ 目录（Kustomize），仓库内清单变更 → ArgoCD 自动同步到集群
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web3-exchange
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/B2BT/web3-exchange.git
    path: k8s/base
    targetRevision: main
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: exchange
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
