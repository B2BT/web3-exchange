# HPA：CPU 自动扩缩容（第二梯队·可用性）
# 说明：无状态微服务可多副本自动扩缩；撮合引擎(order/futures)有内存订单簿状态，
#      暂保持单副本（多副本需状态分区/同步，见 docs/orderbook-persistence.md「生产进一步」）。
# 触发：metrics-server 需在 kind 集群安装（HPA CPU 依赖）。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: exchange
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: exchange-gateway
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
