server:
  port: 8103
  # Tomcat 线程池调优（高并发）
  tomcat:
    threads:
      max: 300
      min-spare: 20
    accept-count: 200
    max-connections: 10000
    connection-timeout: 10000
spring:
  application:
    name: exchange-asset

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP

  datasource:
    # Druid连接池配置
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/web3_exchange?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

    # 连接池配置（调优：max-active 20→50 应对峰值连接）
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,log4j
      use-global-data-source-stat: true

# MyBatis-Plus配置
mybatis-plus:
  # 支持通配符
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描
  type-aliases-package: com.web3.exchange.asset.entity
  # 全局配置
  global-config:
    db-config:
      # 主键策略：ASSIGN_ID（雪花算法）
      id-type: ASSIGN_ID
      # 表名前缀
      table-prefix: t_
      # 逻辑删除配置（实体 @TableLogic 亦生效）
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 字段策略
      insert-strategy: not_null
      update-strategy: not_null
  # MyBatis原生配置
  configuration:
    # 开启驼峰命名
    map-underscore-to-camel-case: true
    # 日志实现
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 自动映射行为
    auto-mapping-behavior: full
    # 二级缓存
    cache-enabled: true
    # 返回null字段
    call-setters-on-nulls: true

# 最简SpringDoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# =============== RocketMQ（消息中间件骨架，批次B） ===============
# nameserver 指向 dev-rmq-namesrv:9876；broker 由 PM 拉起后再做运行时验证，本次仅代码+编译。
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: asset-producer-group
    send-message-timeout: 3000   # 发消息超时(ms)；发送失败降级为仅记录日志，不阻断资金主流程

logging:
  level:
    com.web3.exchange.asset: debug

# 分布式链路追踪（Micrometer Tracing → Zipkin）
management:
  tracing:
    sampling:
      probability: 1.0   # 全采样（演示/排查场景；生产可按需降低如0.1）
