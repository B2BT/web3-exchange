name: CI Build & Push Images

# 触发：push 到 main（含 tag）+ PR 到 main（仅构建不推送）
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'k8s/**', 'contracts/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'k8s/**', 'contracts/**']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/web3-exchange

jobs:
  # ===== Maven 构建（含测试） =====
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -B clean package -DskipTests
      - name: Upload jars artifact
        uses: actions/upload-artifact@v4
        with:
          name: exchange-jars
          path: exchange-*/target/*.jar

  # ===== 构建并推送镜像（矩阵，按服务） =====
  build-images:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, user, order, asset, market, chain, notify, monitor, admin, margin, staking, risk, ticket, futures]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download jars to build context
        uses: actions/download-artifact@v4
        with:
          name: exchange-jars
          path: .   # 放到构建上下文根，供 Dockerfile COPY exchange-<svc>-1.0.0.jar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix={{date 'YYYYMMDD'}}-
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            JAR_SRC=exchange-${{ matrix.service }}-1.0.0.jar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
