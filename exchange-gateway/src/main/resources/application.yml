# application.yml
server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # auth 服务：servlet context-path=/auth，Controller 映射为 /api/auth/***
        # 网关收到 /api/auth/login 后重写为 /auth/api/auth/login，forward 到 exchange-auth 的 /auth 上下文
        - id: auth-service
          uri: lb://exchange-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /auth/api/auth/${segment}
            # 限流：验证码/登录接口较低阈值（replenishRate=5/秒, burstCapacity=10 突发）
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        # user 服务：无 context-path，Controller 映射为 /api/users/***
        - id: user-service
          uri: lb://exchange-user
          predicates:
            - Path=/api/users/**
          filters:
            # 限流：用户接口基础阈值（replenishRate=10/秒, burstCapacity=20 突发）
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        # order 服务：无 context-path，Controller 映射 /api/order/**
        - id: order-service
          uri: lb://exchange-order
          predicates:
            - Path=/api/order/**
        # chain 服务：无 context-path，Controller 映射 /api/chain/**
        - id: chain-service
          uri: lb://exchange-chain
          predicates:
            - Path=/api/chain/**
        # market 服务：无 context-path，Controller 映射 /api/market/**
        - id: market-service
          uri: lb://exchange-market
          predicates:
            - Path=/api/market/**
        # market WebSocket 实时行情：ws 升级原生转发（market 服务注册端点 /api/market/ws 与 /ws）
        # 置于 market-service 之前，确保 /api/market/ws 走专路由（Spring Cloud Gateway 原生支持 WebSocket）
        - id: market-websocket
          uri: lb://exchange-market
          predicates:
            - Path=/api/market/ws
        # notify 服务：无 context-path，Controller 映射 /api/notify/**
        - id: notify-service
          uri: lb://exchange-notify
          predicates:
            - Path=/api/notify/**
        # asset 服务：无 context-path，Controller 映射 /api/asset/**
        - id: asset-service
          uri: lb://exchange-asset
          predicates:
            - Path=/api/asset/**
        # monitor 服务：无 context-path，Controller 映射 /api/monitor/**
        - id: monitor-service
          uri: lb://exchange-monitor
          predicates:
            - Path=/api/monitor/**
        # admin 服务（管理平台）：无 context-path，Controller 映射 /api/admin/**（需 ADMIN 角色，域内校验 role）
        # 该路由不在 AuthFilter 白名单内，须携带合法 JWT（网关注入 X-User-Id），admin 域据此查 role 拦截非管理员。
        - id: admin-service
          uri: lb://exchange-admin
          predicates:
            - Path=/api/admin/**
        # 行情/通知 WebSocket 推送路由（预留）
        # - id: market-websocket
        #   uri: lb://exchange-market
        #   predicates:
        #     - Path=/ws/**
    nacos:
      discovery:
        server-addr: localhost:8848
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

jwt:
  secret: web3-exchange-dev-hs512-jwt-secret-key-2026-0804-please-use-at-least-64-chars
