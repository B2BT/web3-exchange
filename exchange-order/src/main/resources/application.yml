# application.yml
server:
  port: 8104
  # Tomcat 线程池调优（高并发）：工作线程 + 等待队列 + 连接数
  tomcat:
    threads:
      max: 300        # 最大工作线程（默认200 → 调高处理并发）
      min-spare: 20   # 常驻最小线程
    accept-count: 200 # 等待队列长度（超时排队，避免高峰直接拒绝）
    max-connections: 10000 # 最大并发连接
    connection-timeout: 10000

spring:
  application:
    name: exchange-order

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP

  datasource:
    # Druid连接池配置
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/web3_exchange?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

    # 连接池配置（调优：max-active 20→50 应对峰值连接）
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      use-global-data-source-stat: true

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.web3.exchange.order.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      table-prefix: t_
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    auto-mapping-behavior: full
    cache-enabled: true
    call-setters-on-nulls: true

# OpenFeign
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000

# =============== RocketMQ（ORDER-TRADE 事务消息生产者，批次C2） ===============
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: order-producer-group
    send-message-timeout: 3000   # 发消息超时(ms)

# 最简SpringDoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 条件单行情触发任务（批次B）
order:
  trigger:
    market-ticker-url: http://127.0.0.1:8106/api/market/ticker/list

logging:
  level:
    com.web3.exchange.order: debug
